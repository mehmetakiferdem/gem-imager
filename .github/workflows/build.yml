# https://github.com/pcolby/dokit/blob/main/.github/workflows/build.yaml

name: Build
on: workflow_dispatch
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  QT_FORCE_STDERR_LOGGING: 1

jobs:
  # Windows cannot let libusb touch the board's DFU interface until a driver it
  # supports is bound to it, and nothing binds one by default - which is why
  # users are otherwise told to do it by hand with Zadig. wdi-simple is
  # libwdi's own CLI; the installer runs it so the driver is in place before
  # anyone tries a DFU transfer. Built here rather than vendored because only
  # the resulting .exe is needed, and it is invoked as a separate process, so
  # libwdi's LGPL does not reach this project's own sources.
  windows_dfu_driver:
    runs-on: windows-2022
    env:
      LIBWDI_REF: v1.5.1
      # WDK 8.0 redistributable: the only part of the WDK libwdi needs, and the
      # last one to still ship the WinUSB co-installers its INF template copies
      WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git
      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: ${{ env.LIBWDI_REF }}
          path: libwdi
      - name: Fetch the WDK redistributable
        shell: cmd
        run: |
          cd libwdi
          curl -L "%WDK_URL%" -o wdk-redist.msi
          msiexec /a %CD%\wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          if not exist "wdk\Windows Kits\8.0" exit /b 1
      - name: Build wdi-simple
        shell: msys2 {0}
        run: |
          cd libwdi
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 \
            --disable-32bit --disable-shared --disable-debug \
            --enable-examples-build \
            --with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          test -f examples/wdi-simple.exe
          sha256sum examples/wdi-simple.exe
      - name: Upload wdi-simple
        uses: actions/upload-artifact@v6
        with:
          name: wdi-simple
          path: libwdi/examples/wdi-simple.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Upgrade OS
        run: |
          sudo apt-mark hold firefox grub-efi-amd64-signed
          sudo apt update && sudo apt upgrade
      - name: Install dependencies
        run: |
          sudo apt install --no-install-recommends build-essential cmake git libgnutls28-dev libxcb-cursor-dev libusb-1.0-0-dev pkg-config
          sudo wget -O ${{ runner.temp }}/appimagecraft.AppImage https://github.com/TheAssassin/appimagecraft/releases/download/continuous/appimagecraft-x86_64.AppImage
          sudo chmod +x ${{ runner.temp }}/appimagecraft.AppImage
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '>=3.2.0'
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtimageformats qtpdf qtserialport qtvirtualkeyboard qtquick3d'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        id: build
        run: |
            # install-qt-action v4 exports QT_ROOT_DIR instead of Qt6_DIR
            export Qt6_ROOT="$QT_ROOT_DIR"
            export QMAKE="$QT_ROOT_DIR/bin/qmake"
            export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib"

            sed -i "s@Qt6_ROOT=.*@Qt6_ROOT=\"$Qt6_ROOT\"@" appimagecraft.yml
            sed -i "s@QMAKE: .*@QMAKE: \"$QMAKE\"@" appimagecraft.yml

            ${{ runner.temp }}/appimagecraft.AppImage
            imager_version=$(grep '  version:' appimagecraft.yml | cut -d ':' -f 2 | tr -d ' ')
            tee -a "${GITHUB_OUTPUT}" <<< gemImagerVersion="$imager_version"
            mv Gemstone_Imager-${imager_version}-x86_64.AppImage GemImager-${imager_version}.AppImage
      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: GemImager Linux ${{ steps.build.outputs.gemImagerVersion }}
          path: GemImager-${{ steps.build.outputs.gemImagerVersion }}.AppImage

  windows:
    runs-on: windows-2022
    needs: windows_dfu_driver
    defaults: { run: { shell: cmd } }
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '>=3.2.0'
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtimageformats qtpdf qtserialport qtvirtualkeyboard qtquick3d'
          tools: 'tools_mingw90'
      - name: Install NSIS
        shell: powershell
        run: |
          iwr -useb get.scoop.sh -outfile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          scoop update
          scoop bucket add extras
          scoop install nsis
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set MINGW64_ROOT
        shell: powershell
        run: |
          $mingw_dir = (Resolve-Path "$($env:QT_ROOT_DIR)\..\..\Tools\mingw1120_64").Path -replace '\\', '/'
          (Get-Content "src\CMakeLists.txt") -replace 'set\(MINGW64_ROOT "C:/Qt/Tools/mingw1120_64"', "set(MINGW64_ROOT `"$mingw_dir`"" | Set-Content "src\CMakeLists.txt"
      - name: Configure
        id: build
        run: |
            set Path=%QT_ROOT_DIR%\..\..\Tools\mingw1120_64\bin;%Path%
            cmake -S "%GITHUB_WORKSPACE%\src" -B "%GITHUB_WORKSPACE%\build" ^
              -DQT_QMAKE_EXECUTABLE:FILEPATH="%QT_ROOT_DIR%\bin\qmake.exe" ^
              -DCMAKE_BUILD_TYPE:STRING=Release ^
              -DCMAKE_PREFIX_PATH:PATH="%QT_ROOT_DIR%" ^
              -DCMAKE_GENERATOR:STRING=Ninja ^
              -G "Ninja"
      - name: Build
        run: |
          set Path=%QT_ROOT_DIR%\..\..\Tools\mingw1120_64\bin;%Path%
          cmake --build "%GITHUB_WORKSPACE%\build" --parallel
      # After the build, so windeployqt cannot race with it
      - name: Fetch wdi-simple
        uses: actions/download-artifact@v7
        with:
          name: wdi-simple
          path: ${{ github.workspace }}\build\deploy
      - name: Make NSIS installer
        run: |
          if not exist "%GITHUB_WORKSPACE%\build\deploy\wdi-simple.exe" exit /b 1
          makensis %GITHUB_WORKSPACE%\build\gem-imager.nsi
      - name: Get project version
        id: getversion
        shell: bash
        run: |
          version=$(grep IMAGER_VERSION_STR "$GITHUB_WORKSPACE/build/CMakeCache.txt" | cut -d '=' -f 2)
          mv $GITHUB_WORKSPACE/build/gem-imager-${version}.exe $GITHUB_WORKSPACE/build/GemImager-${version}.exe
          tee -a "${GITHUB_OUTPUT}" <<< gemImagerVersion="$version"
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: GemImager Windows ${{ steps.getversion.outputs.gemImagerVersion }}
          path: ${{ github.workspace }}\build\GemImager-${{ steps.getversion.outputs.gemImagerVersion }}.exe

  macos:
    runs-on: macos-14
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '>=3.2.0'
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats qtpdf qtserialport qtvirtualkeyboard qtquick3d'
      - name: Checkout
        uses: actions/checkout@v5

      # macOS keys a privacy (TCC) grant to the code signature, so on an
      # unsigned build the grant breaks on every rebuild as the cdhash changes
      # and the user has to re-add the app to Full Disk Access by hand. Sign
      # with a Developer ID and notarize whenever the secrets are configured;
      # fall back to an unsigned build (forks, PRs) so the job never blocks.
      - name: Check for signing credentials
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE/MACOS_SIGNING_IDENTITY not set - producing an UNSIGNED build. Users will have to grant Full Disk Access by hand, and the grant will not survive an update."
          fi
          # Notarisation is optional: signing alone is enough for a locally
          # built app, because a bundle that was never downloaded carries no
          # quarantine attribute for Gatekeeper to check. A DMG handed to
          # someone else does need it.
          if [ -n "$APPLE_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign blocks on a GUI prompt for the private key
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure
        run: |
          EXTRA=()
          if [ "${{ steps.signing.outputs.sign }}" = "true" ]; then
            EXTRA+=(-DIMAGER_SIGNED_APP:BOOL=ON)
            EXTRA+=(-DIMAGER_SIGNING_IDENTITY:STRING="${{ secrets.MACOS_SIGNING_IDENTITY }}")
          fi
          # Notarisation is driven from the steps below rather than from
          # CMake's IMAGER_NOTARIZE_APP, which expects a notarytool keychain
          # profile to have been stored beforehand.
          cmake -S "$GITHUB_WORKSPACE/src" -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_PREFIX_PATH:PATH="$QT_ROOT_DIR" \
            -DQt6_ROOT:PATH="$QT_ROOT_DIR" \
            -DQT_QMAKE_EXECUTABLE:FILEPATH="$QT_ROOT_DIR/bin/qmake" \
            "${EXTRA[@]}"
      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel
      - name: Get project version
        id: getversion
        run: |
          version=$(grep IMAGER_VERSION_STR "$GITHUB_WORKSPACE/build/CMakeCache.txt" | cut -d '=' -f 2)
          mv "$GITHUB_WORKSPACE/build/GemstoneImager-${version}.dmg" "$GITHUB_WORKSPACE/build/GemImager-${version}.dmg"
          tee -a "${GITHUB_OUTPUT}" <<< gemImagerVersion="$version"

      - name: Notarize and staple
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="$GITHUB_WORKSPACE/build/GemImager-${{ steps.getversion.outputs.gemImagerVersion }}.dmg"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          # Staple the ticket so Gatekeeper accepts the DMG offline
          xcrun stapler staple "$DMG"

      - name: Verify signature
        if: steps.signing.outputs.sign == 'true'
        run: |
          DMG="$GITHUB_WORKSPACE/build/GemImager-${{ steps.getversion.outputs.gemImagerVersion }}.dmg"
          APP="$GITHUB_WORKSPACE/build/GemstoneImager.app"
          # The bundle is what has to be signed inside-out; verify it strictly
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Timestamp|flags'
          codesign --verify --verbose=2 "$DMG"
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            # Gatekeeper's own verdict; only meaningful once notarized
            spctl --assess --type open --context context:primary-signature -vv "$DMG"
            xcrun stapler validate "$DMG"
          else
            echo "::warning::Signed but not notarized (APPLE_ID not set). Gatekeeper will refuse this DMG on a user's machine."
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: GemImager macOS ${{ steps.getversion.outputs.gemImagerVersion }}
          path: build/GemImager-${{ steps.getversion.outputs.gemImagerVersion }}.dmg
