version: 1

project:
  name: org.t3gemstone.gem-imager
  version: 1.1.1

build:
  cmake:
    source_dir: src/
    # QT6_ROOT must be exported before running appimagecraft, e.g.:
    #   export QT6_ROOT=$HOME/Qt/6.7.3/gcc_64
    extra_variables:
    - Qt6_ROOT="${QT6_ROOT:?QT6_ROOT is not set - export it to your Qt installation, e.g. export QT6_ROOT=$HOME/Qt/6.7.3/gcc_64}"
    environment:
      BUILD_TYPE: MinSizeRel

appimage:
  linuxdeploy:
    plugins:
      - qt
    raw_environment:
      QML_SOURCES_PATHS: "\"$PROJECT_ROOT\"/src/qmlcomponents/"
      # linuxdeploy resolves the binary's dependencies via the dynamic
      # linker search path; the Qt lib dir must be on it, otherwise
      # deployment fails with e.g. "Could not find dependency: libQt6SerialPort.so.6".
      LD_LIBRARY_PATH: "$QT6_ROOT/lib:$LD_LIBRARY_PATH"
    extra_args: --exclude-library "libwayland-*"
    environment:
      # Disable Wayland back-end until the dependency problem gets resolved.
      # Essentially, importing libqwayland-generic causes the AppImage dependency walker
      # to find libwayland-client from the build OS, and include that in the AppImage.
      # This is deleterious - because the the runtime OS graphics stack also depends on that
      # library to create native window types. With no strong ABI versioning on that library,
      # you wind up with exotic symbol resolution failures at runtime.
      # See-Also:
      # EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
      # EXTRA_QT_PLUGINS: "waylandcompositor"
      QMAKE: "$QT6_ROOT/bin/qmake"
